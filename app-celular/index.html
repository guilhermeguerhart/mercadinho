<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F3354">
  <meta name="description" content="Mercado Gerência: vendas do dia, caixas, análises e avisos do mercado no celular.">
  <title>Mercado Gerência</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- Entrada: mesmo usuário e senha do programa do mercado; só o gerente entra -->
  <main id="telaLogin" class="login" hidden>
    <div class="toldo" aria-hidden="true"></div>
    <div class="login-corpo">
      <div class="marca"><span class="logo">M</span><span>Mercado <small>Gerência</small></span></div>
      <h1>Entrar</h1>
      <p class="suave">Use o mesmo usuário e senha do programa do mercado. Só o gerente entra.</p>
      <form id="formLogin" novalidate>
        <label for="usuario">Usuário</label>
        <input id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ex.: ze.gerente" required>
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" required>
        <p id="erroLogin" class="erro" role="alert"></p>
        <button id="botaoEntrar" class="primario" type="submit">Entrar</button>
      </form>
    </div>
  </main>

  <!-- Área do gerente -->
  <div id="telaApp" class="app" hidden>
    <header class="topo">
      <div class="toldo" aria-hidden="true"></div>
      <div class="topo-linha">
        <div class="marca"><span class="logo">M</span><span>Mercado</span></div>
        <label class="interruptor" title="Esconde os valores de venda da tela">
          <input id="ocultar" type="checkbox"><span class="trilho" aria-hidden="true"></span><span>Ocultar</span>
        </label>
      </div>
    </header>

    <main id="conteudo" class="conteudo" aria-live="polite">
      <section id="abaHoje" class="aba"></section>
      <section id="abaAnalises" class="aba" hidden></section>
      <section id="abaAvisos" class="aba" hidden></section>
      <section id="abaConta" class="aba" hidden></section>
    </main>

    <nav class="abas" aria-label="Telas">
      <button data-aba="Hoje" class="ativo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 9h16M9 9v11"/></svg>Hoje</button>
      <button data-aba="Analises"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Análises</button>
      <button data-aba="Avisos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3zM12 10v4M12 17v.5"/></svg>Avisos<span id="contaAvisos" class="bolinha" hidden></span></button>
      <button data-aba="Conta"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Conta</button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
